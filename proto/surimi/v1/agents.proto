syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/sales.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message GetSalesSummaryRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetSalesSummaryResponse {
  repeated SalesSummary sales_summaries = 1;
}

service AgentsService {
  rpc GetSalesSummary(GetSalesSummaryRequest) returns (GetSalesSummaryResponse);
}
